name: Release new version

on:
  workflow_dispatch:

concurrency:
  group: maven-publication
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native-build:
    uses: ./.github/workflows/native-build.yml

  release:
    needs: native-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check release branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release is only allowed from main"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 25
          distribution: temurin
          gpg-private-key: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          cache: maven

      - name: Download native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native-resources
          merge-multiple: true

      - name: Configure Git
        run: |
          git config user.name "Airlift Release"
          git config user.email "airlift-bot@airlift.io"

      - name: Verify release configuration
        env:
          MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_NEXUS2_MAVEN_CENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_NEXUS2_MAVEN_CENTRAL_TOKEN }}
        run: |
          ./mvnw -B njord:status | tee "${RUNNER_TEMP}/njord-status.log"
          grep -F "Repository Auth: Present" "${RUNNER_TEMP}/njord-status.log"
          grep -F "Effective URL: njord:template:release-sca" "${RUNNER_TEMP}/njord-status.log"

      - name: Prepare release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: |
          ./mvnw -B release:prepare -Poss-release \
              -Dexec.skip=true \
              -Dvthreadtime.native.resources="${RUNNER_TEMP}/native-resources/resources" \
              -Darguments="-Dexec.skip=true -Dvthreadtime.native.resources=${RUNNER_TEMP}/native-resources/resources"

      - name: Determine release version
        run: |
          VERSION=$(grep 'scm.tag=' release.properties | cut -d'=' -f2)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Releasing version: ${VERSION}"

      - name: Stage release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: |
          ./mvnw -B release:perform -Poss-release \
              -Darguments="-Dexec.skip=true -Dvthreadtime.native.resources=${RUNNER_TEMP}/native-resources/resources"

      - name: Validate release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_NEXUS2_MAVEN_CENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_NEXUS2_MAVEN_CENTRAL_TOKEN }}
        run: |
          ./mvnw njord:list
          ./mvnw njord:status
          ./mvnw njord:validate

      - name: Publish release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_NEXUS2_MAVEN_CENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_NEXUS2_MAVEN_CENTRAL_TOKEN }}
        run: ./mvnw njord:publish -Poss-release

      - name: Push release commits and tags
        run: |
          git push origin main
          git push origin --tags

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} ${VERSION}" \
              --generate-notes
